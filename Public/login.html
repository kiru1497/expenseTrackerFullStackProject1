<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script
      src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"
      defer
    ></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        font-family: "Poppins", sans-serif;
        background: #020617;
        overflow-x: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Background */
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(rgba(2, 6, 23, 0.9), rgba(2, 6, 23, 0.94)),
          url("https://images.unsplash.com/photo-1642790106117-e829e14a795f?q=80&w=2070&auto=format&fit=crop")
            center/cover no-repeat;
        z-index: -3;
      }

      body::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(
            circle at 20% 30%,
            rgba(0, 255, 200, 0.14),
            transparent 25%
          ),
          radial-gradient(
            circle at 80% 20%,
            rgba(0, 132, 255, 0.2),
            transparent 30%
          ),
          radial-gradient(
            circle at 70% 80%,
            rgba(0, 255, 170, 0.1),
            transparent 25%
          );
        z-index: -2;
      }

      /* Finance glowing lines */
      .finance-lines {
        position: absolute;
        inset: 0;
        overflow: hidden;
        z-index: -1;
      }

      .finance-lines::before,
      .finance-lines::after {
        content: "";
        position: absolute;
        width: 120%;
        height: 220px;
        left: -10%;
        border-radius: 50%;
        filter: blur(2px);
      }

      .finance-lines::before {
        bottom: 60px;
        border: 3px solid rgba(0, 255, 204, 0.45);
        border-color: transparent transparent rgba(0, 255, 204, 0.45)
          transparent;
        transform: rotate(-2deg);
      }

      .finance-lines::after {
        bottom: 20px;
        border: 3px solid rgba(0, 140, 255, 0.45);
        border-color: transparent transparent rgba(0, 140, 255, 0.45)
          transparent;
      }

      .login-wrapper {
        width: 100%;
        max-width: 560px;
        padding: 20px;
      }

      .card {
        background: rgba(5, 15, 35, 0.72);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(0, 255, 255, 0.16);
        border-radius: 28px;
        box-shadow:
          0 0 20px rgba(0, 255, 255, 0.08),
          0 0 80px rgba(0, 0, 0, 0.6);
        overflow: hidden;
        position: relative;
      }

      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        padding: 1px;
        border-radius: 28px;
        background: linear-gradient(
          135deg,
          rgba(0, 255, 255, 0.35),
          rgba(0, 119, 255, 0.08),
          rgba(0, 255, 170, 0.25)
        );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      .card-body {
        padding: 48px 42px !important;
      }

      .logo-icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 255, 200, 0.08);
        border: 1px solid rgba(0, 255, 200, 0.2);
        box-shadow: 0 0 20px rgba(0, 255, 200, 0.2);
      }

      .logo-icon svg {
        width: 36px;
        height: 36px;
        stroke: #00ffd0;
      }

      h3 {
        color: #ffffff;
        font-size: 2.3rem;
        font-weight: 700;
        margin-bottom: 8px !important;
      }

      .subtitle {
        color: #9fb3c8;
        text-align: center;
        margin-bottom: 35px;
        font-size: 0.98rem;
      }

      .form-label {
        color: #ffffff;
        font-size: 0.95rem;
        margin-bottom: 10px;
        font-weight: 500;
      }

      .form-control {
        height: 58px;
        border-radius: 16px;
        border: 1px solid rgba(0, 162, 255, 0.2);
        background: rgba(8, 20, 40, 0.85);
        color: #ffffff;
        padding: 14px 18px;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        box-shadow: none !important;
      }

      .form-control::placeholder {
        color: #7d8ca3;
      }

      .form-control:focus {
        border-color: #00ffd0;
        background: rgba(10, 25, 48, 0.95);
        color: #ffffff;
        box-shadow:
          0 0 0 0.2rem rgba(0, 255, 208, 0.08),
          0 0 18px rgba(0, 255, 208, 0.15) !important;
      }

      .btn-primary {
        height: 58px;
        border: none;
        border-radius: 16px;
        margin-top: 18px;
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        background: linear-gradient(90deg, #007bff, #00ffd0);
        color: #02111f;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .btn-primary::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          120deg,
          transparent,
          rgba(255, 255, 255, 0.25),
          transparent
        );
        transition: 0.5s;
      }

      .btn-primary:hover::before {
        left: 100%;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow:
          0 12px 28px rgba(0, 255, 208, 0.2),
          0 0 18px rgba(0, 255, 208, 0.25);
      }

      #forgotPasswordBtn {
        color: #00ffd0;
        text-decoration: none;
        font-weight: 500;
        margin-top: 12px;
      }

      #forgotPasswordBtn:hover {
        color: #ffffff;
      }

      #forgotPasswordSection {
        background: rgba(8, 20, 40, 0.65);
        border: 1px solid rgba(0, 255, 255, 0.1);
        border-radius: 18px;
        padding: 18px;
      }

      #forgotPasswordSection h4 {
        color: #ffffff;
        margin-bottom: 15px;
        font-size: 1.2rem;
      }

      p {
        color: #cbd5e1;
        font-size: 0.95rem;
      }

      a {
        color: #00ffd0;
        text-decoration: none;
        font-weight: 500;
        transition: 0.3s ease;
      }

      a:hover {
        color: #ffffff;
      }

      @media (max-width: 768px) {
        .card-body {
          padding: 38px 24px !important;
        }

        h3 {
          font-size: 2rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="finance-lines"></div>

    <div class="container login-wrapper">
      <div class="row justify-content-center">
        <div class="col-md-10 col-lg-12">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <div class="logo-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.8"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M3 17l6-6 4 4 7-7"
                  />
                </svg>
              </div>

              <h3 class="text-center">Welcome Back</h3>

              <p class="subtitle">Log in to manage your finances smarter</p>

              <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-3">
                  <label class="form-label">Email</label>

                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Enter email"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Password</label>

                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Create Password"
                    required
                  />
                </div>

                <button type="submit" class="btn btn-primary w-100">
                  Login
                </button>

                <div class="text-center mt-2">
                  <button id="forgotPasswordBtn" class="btn btn-link">
                    Forgot Password?
                  </button>
                </div>
              </form>

              <div id="forgotPasswordSection" class="container mt-3 d-none">
                <h4>Reset Password</h4>

                <form id="forgotPasswordForm">
                  <input
                    type="email"
                    id="resetEmail"
                    class="form-control mb-3"
                    placeholder="Enter your email"
                    required
                  />

                  <button class="btn btn-primary w-100">Send Reset Link</button>
                </form>
              </div>

              <p class="text-center mt-4 mb-0">
                New user? Create an account now!
                <a href="#">Sign up</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="login.js"></script>
  </body>
</html>
